# Generated for Fly.io deployment of the holocron app.
# Mirrors the Kamal/once deployment on cloud.sarrietav.dev.

app = "sarrietav-dev-holocron"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  RAILS_ENV = "production"
  SOLID_QUEUE_IN_PUMA = "true"
  BASE_URL = "https://holocron.sarrietav.dev"
  # Thruster defaults to HTTP_PORT=80, a privileged port that only root may
  # bind. Docker grants CAP_NET_BIND_SERVICE automatically but Fly's
  # Firecracker does not, so run Thruster on an unprivileged port and let the
  # Fly proxy terminate TLS in front of it.
  HTTP_PORT = "8080"
  APP_HOST = "holocron.sarrietav.dev"
  APP_PROTOCOL = "https"
  MAILER_FROM = "holocron@sarrietav.dev"
  SMTP_ADDRESS = "smtp.resend.com"
  SMTP_AUTHENTICATION = "plain"
  SMTP_DOMAIN = "sarrietav.dev"
  SMTP_PORT = "587"
  SMTP_STARTTLS = "true"
  SMTP_USER_NAME = "resend"

[mounts]
  source = "sarrietav_dev_holocron_storage"
  destination = "/rails/storage"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 20

  [[http_service.checks]]
    grace_period = "45s"
    interval = "15s"
    method = "GET"
    path = "/up"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
